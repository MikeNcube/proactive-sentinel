<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proactive Sentinel SOC Dashboard</title>
    <style>
        :root {
            --bg: #060b1a;
            --panel: #0d152b;
            --panel-2: #111b35;
            --text: #d4e0ff;
            --muted: #8ea2d6;
            --accent: #00d084;
            --critical: #ff4d4f;
            --high: #ff8c42;
            --medium: #ffd166;
            --low: #5ecb5e;
            --border: #22345f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Consolas, "Courier New", monospace;
            background: linear-gradient(180deg, #050913 0%, #070e22 100%);
            color: var(--text);
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        h1, h2, h3 { margin: 0 0 10px; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .brand { color: var(--accent); letter-spacing: 0.5px; }
        .hint, .muted { color: var(--muted); font-size: 13px; }
        .grid { display: grid; gap: 12px; }
        .stats { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
        .stat {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }
        .stat .label { color: var(--muted); font-size: 12px; }
        .stat .value { font-size: 24px; margin-top: 5px; }
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 420px; }
        label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0a1228;
            color: var(--text);
            font-family: inherit;
        }
        button {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f234a;
            color: var(--text);
            padding: 10px 14px;
            cursor: pointer;
            font-family: inherit;
        }
        button.primary {
            background: linear-gradient(180deg, #0c3f2e, #0a2f24);
            border-color: #1f7a5b;
            color: #dcffef;
            width: 100%;
            margin-top: 14px;
        }
        .error {
            margin-top: 10px;
            color: #ffc9c9;
            background: rgba(255, 77, 79, 0.15);
            border: 1px solid rgba(255, 77, 79, 0.45);
            padding: 8px 10px;
            border-radius: 6px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }
        th { color: var(--muted); font-weight: 600; }
        .sev { font-weight: 700; text-transform: uppercase; }
        .sev-critical { color: var(--critical); }
        .sev-high { color: var(--high); }
        .sev-medium { color: var(--medium); }
        .sev-low { color: var(--low); }
        .status-online { color: var(--low); }
        .status-offline { color: var(--critical); }
        .hidden { display: none !important; }
        .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <section id="loginView" class="login-wrap">
        <div class="panel login-box">
            <h2 class="brand">Proactive Sentinel SOC</h2>
            <p class="hint">Sign in to continue. Hint: admin@zororo.co.za</p>
            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" required />
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required />
                <button class="primary" type="submit">Login</button>
                <div id="loginError" class="error"></div>
            </form>
        </div>
    </section>

    <section id="dashView" class="hidden">
        <div class="container">
            <div class="panel header">
                <h1 class="brand">Proactive Sentinel SOC</h1>
                <button id="logoutBtn" type="button">Logout</button>
            </div>

            <div class="grid stats">
                <div class="stat"><div class="label">Total Alerts</div><div id="statTotal" class="value">0</div></div>
                <div class="stat"><div class="label">Critical</div><div id="statCritical" class="value sev-critical">0</div></div>
                <div class="stat"><div class="label">High</div><div id="statHigh" class="value sev-high">0</div></div>
                <div class="stat"><div class="label">Medium</div><div id="statMedium" class="value sev-medium">0</div></div>
            </div>

            <div class="two-col">
                <div class="panel">
                    <h3>Alerts</h3>
                    <div class="muted" id="alertsMeta">Loading...</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Severity</th>
                                <th>Status</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="alertsBody"></tbody>
                    </table>
                </div>

                <div class="panel">
                    <h3>Zororo-Phumulani Units</h3>
                    <div class="muted" id="unitsMeta">Loading...</div>
                    <table>
                        <thead>
                            <tr><th>Device</th><th>Status</th></tr>
                        </thead>
                        <tbody id="unitsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script>
        let accessToken = null;
        let refreshTimer = null;

        const loginView = document.getElementById("loginView");
        const dashView = document.getElementById("dashView");
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");

        function showLogin(errorText = "") {
            accessToken = null;
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
            dashView.classList.add("hidden");
            loginView.classList.remove("hidden");
            if (errorText) {
                loginError.textContent = errorText;
                loginError.style.display = "block";
            } else {
                loginError.style.display = "none";
                loginError.textContent = "";
            }
        }

        function showDashboard() {
            loginView.classList.add("hidden");
            dashView.classList.remove("hidden");
        }

        async function apiRequest(path, options = {}) {
            const headers = { ...(options.headers || {}) };
            if (accessToken) {
                headers["Authorization"] = `Bearer ${accessToken}`;
            }
            if (!headers["Content-Type"] && options.body) {
                headers["Content-Type"] = "application/json";
            }
            const response = await fetch(path, { ...options, headers });
            if (response.status === 401) {
                showLogin("Session expired. Please log in again.");
                throw new Error("Unauthorized");
            }
            return response;
        }

        function severityClass(severity) {
            const s = (severity || "").toLowerCase();
            if (s === "critical") return "sev-critical";
            if (s === "high") return "sev-high";
            if (s === "medium") return "sev-medium";
            return "sev-low";
        }

        function fmtTime(iso) {
            if (!iso) return "-";
            const d = new Date(iso);
            return isNaN(d.getTime()) ? iso : d.toLocaleString();
        }

        async function loadAlertsAndStats() {
            const alertsRes = await apiRequest("/api/alerts");
            if (!alertsRes.ok) throw new Error("Failed to load alerts");
            const alertsData = await alertsRes.json();
            const alerts = alertsData.alerts || [];

            const counts = { critical: 0, high: 0, medium: 0, low: 0 };
            alerts.forEach(a => {
                const key = (a.severity || "low").toLowerCase();
                if (counts[key] !== undefined) counts[key] += 1;
            });

            document.getElementById("statTotal").textContent = String(alerts.length);
            document.getElementById("statCritical").textContent = String(counts.critical);
            document.getElementById("statHigh").textContent = String(counts.high);
            document.getElementById("statMedium").textContent = String(counts.medium);
            document.getElementById("alertsMeta").textContent = `Updated ${new Date().toLocaleTimeString()}`;

            const body = document.getElementById("alertsBody");
            body.innerHTML = "";
            if (alerts.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="muted">No alerts found.</td></tr>`;
                return;
            }
            alerts.forEach(alert => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${alert.title || "-"}</td>
                    <td class="sev ${severityClass(alert.severity)}">${alert.severity || "-"}</td>
                    <td>${alert.status || "-"}</td>
                    <td>${fmtTime(alert.created_at)}</td>
                `;
                body.appendChild(row);
            });
        }

        async function loadUnits() {
            const unitsRes = await apiRequest("/api/units/status");
            if (!unitsRes.ok) throw new Error("Failed to load units");
            const unitsData = await unitsRes.json();
            const units = unitsData.units || [];

            document.getElementById("unitsMeta").textContent = `Updated ${new Date().toLocaleTimeString()}`;
            const body = document.getElementById("unitsBody");
            body.innerHTML = "";
            if (units.length === 0) {
                body.innerHTML = `<tr><td colspan="2" class="muted">No units found.</td></tr>`;
                return;
            }
            units.forEach(unit => {
                const status = (unit.status || "offline").toLowerCase();
                const cls = status === "online" ? "status-online" : "status-offline";
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${unit.device_id || "-"}</td>
                    <td class="${cls}">${status}</td>
                `;
                body.appendChild(row);
            });
        }

        async function refreshAll() {
            await Promise.all([loadAlertsAndStats(), loadUnits()]);
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginError.style.display = "none";
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.access_token) {
                    throw new Error(data.error || "Login failed");
                }
                accessToken = data.access_token;
                showDashboard();
                await refreshAll();
                refreshTimer = setInterval(refreshAll, 30000);
            } catch (err) {
                showLogin(err.message || "Login failed");
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            showLogin();
        });

        showLogin();
    </script>
</body>
</html>
